# Packaged GUI tests launch the built .app executable directly. Pin its hash
# and use a unique app-data directory under each driver's case artifact folder.
# gui-bundle imports an L6 package first, then the configured L6max package;
# its own checks verify per-model state isolation and bundled QEMU identity.
# [legacy."gui-bundle"]
# executable = "/absolute/path/to/L6max Emulator.app/Contents/MacOS/l6max-gui"
# executable_sha256 = "REPLACE_WITH_SHA256_OF_BUNDLED_GUI_EXECUTABLE"
# environment = { L6_APP_DATA = "{logs}/app-data", L6_BUNDLE_SMOKE_FIRST = "/absolute/path/to/L6.BIN", L6_BUNDLE_SMOKE_SECOND = "{package}", L6_BUNDLE_SMOKE_QEMU_SHA256 = "REPLACE_WITH_SHA256_OF_BUNDLED_QEMU" }
#
# gui-menu checks native file and directory pickers without disturbing a running
# guest. It verifies the bundled QEMU independently of the host QEMU pin above.
# [legacy."gui-menu"]
# executable = "/absolute/path/to/L6max Emulator.app/Contents/MacOS/l6max-gui"
# executable_sha256 = "REPLACE_WITH_SHA256_OF_BUNDLED_GUI_EXECUTABLE"
# environment = { L6_APP_DATA = "{logs}/app-data", L6_MENU_SMOKE_FIRMWARE = "{package}", L6_MENU_SMOKE_QEMU_SHA256 = "REPLACE_WITH_SHA256_OF_BUNDLED_QEMU" }

# Expected failures match an exact case/model/step plus an error substring.
# A pass becomes XPASS; unrelated failures stay FAIL. Never add one just to get green.
# [[expected_failure]]
# case = "mute"
# model = "l6"
# step = 11
# contains = "ExpectMute"
# reason = "Link to the tracked investigation"
