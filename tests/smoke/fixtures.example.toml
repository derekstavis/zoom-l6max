# Copy to smoke.local.toml at the repository root. Paths are relative to that file.
# The prepared scenario assumes L6max startup SD navigation is applicable and
# channel 2 starts at the minimum ring mask 0x001 (required by the reversal check).
version = 1
qemu = "/absolute/path/to/qemu-system-arm"
qemu_sha256 = "REPLACE_WITH_SHA256_FROM_shasum_-a_256"

[[fixture]]
name = "prepared"
model = "l6"
firmware_package = "/absolute/path/to/L6.BIN"
state_template = "/absolute/path/to/known-l6-state"
# An empty card suffices for storage cases:
# cargo run --offline --locked -p l6fs -- card create l6-card.img --size-mib 128
sd_image = "/absolute/path/to/l6-card.img"
timing = "paced"

[[fixture]]
name = "prepared"
model = "l6max"
firmware_package = "/absolute/path/to/L6max.bin"
state_template = "/absolute/path/to/known-l6max-state"
sd_image = "/absolute/path/to/l6max-card.img"
timing = "paced"

# The L6 recorder playback test needs the normal QEMU audio queue service; it
# records the result through the QEMU WAV backend while keeping the run headless.
[[fixture]]
name = "l6-recorder-playback"
model = "l6"
firmware_package = "/absolute/path/to/L6.BIN"
state_template = "/absolute/path/to/mode-0-recorder-state"
sd_image = "/absolute/path/to/card-with-RECORDER-recording-MASTER.WAV.img"
audio_device = "driver=wav,id=l6-audio,path={logs}/audio.wav"
gdb = true

