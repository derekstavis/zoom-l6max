version = 1
name = "sd-midi-volatile"
models = ["l6", "l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
sd_patches = ["midi-sync"]

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 40000
guest_timeout_ms = 45000
wall_timeout_s = 900

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "sd-card"
inserted = false

[[step]]
action = "delay"
guest_ms = 1000

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "restart"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 40000
guest_timeout_ms = 45000
wall_timeout_s = 900

[[step]]
action = "expect-sd-patch"
loaded = false

[[step]]
action = "sd-card"
inserted = true

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "delay"
guest_ms = 20000
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "expect-sd-patch"
loaded = true
