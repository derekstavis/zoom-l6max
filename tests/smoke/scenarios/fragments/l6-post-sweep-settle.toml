# On saved-state and prompt-driven boots, L6's encoder sweep passes through a
# blank-ring interval before MAIN's saved values settle. Spec-built state
# restores the rings once, about three guest seconds after the sweep, and
# mixer-ready rejects blank rings, so the wait counts as setup input.
[[step]]
setup_input = true
action = "delay"
guest_ms = 18000
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 30000
wall_timeout_s = 180
