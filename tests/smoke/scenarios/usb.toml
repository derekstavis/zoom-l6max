version = 1
name = "usb"
models = ["l6", "l6max"]
backends = ["headless"]
fixture = "fresh"

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 120000
wall_timeout_s = 600

[[step]]
setup_input = true
models = ["l6"]
action = "press"
control = "ch4-mono"

# L6max: complete first-boot setup. A state spec boots without it.
[[step]]
setup_input = true
models = ["l6max"]
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 2000

[[step]]
setup_input = true
models = ["l6"]
action = "press"
control = "ch4-mono"

[[step]]
setup_input = true
models = ["l6max"]
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 5000

# Waits for firmware to start its USB controller after boot.
[[step]]
action = "usb-descriptors"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "encoder"
channel = 1
steps = 4

[[step]]
action = "expect-encoder-reports"

[[step]]
action = "usb-midi"
value = 32

[[step]]
action = "delay"
guest_ms = 1000
