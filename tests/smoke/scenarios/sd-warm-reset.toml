version = 1
name = "sd-warm-reset"
models = ["l6", "l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
sd_patches = ["midi-sync"]

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "sd-card"
inserted = false

[[step]]
action = "warm-reset"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = false
