version = 1
name = "l6max-ui-pad-assignments"
models = ["l6max"]
fixture = "prepared"
backends = ["headless"]

[[step]]
action = "include"
path = "fragments/editor-pad-setup-l6max.toml"

[[step]]
action = "include"
path = "fragments/editor-pad-usb-ready.toml"

# Select the first WAV through the on-device Sound Assign menu, then verify
# the assignment through Editor SysEx state readback.
[[step]]
action = "l6max-ui-pad-assignment"
pad = 0
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "l6max-ui-pad-assignment"
pad = 1
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "l6max-ui-pad-assignment"
pad = 2
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "l6max-ui-pad-assignment"
pad = 3
guest_timeout_ms = 30000
wall_timeout_s = 600
