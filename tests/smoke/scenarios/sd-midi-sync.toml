version = 1
name = "sd-midi-sync"
gdb = true
models = ["l6", "l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
sd_patches = ["midi-sync"]

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "expect-heap"
minimum_free = 131072

[[step]]
models = ["l6"]
action = "l6-midi-sync"
guest_timeout_ms = 15000
wall_timeout_s = 180
