version = 1
name = "sd-dual-efx-emulator"
models = ["l6max"]
backends = ["headless"]
state = "dual-efx-room"
card = "empty"
sd_patches = ["dual-efx"]
gdb = true

[[audio_input]]
channel = 1
loop-tone = { hz = 440.0, seconds = 1.0, amplitude = 0.1 }

[[step]]
action = "audio-input-transport"
command = "play"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "expect-heap"
minimum_free = 131072

