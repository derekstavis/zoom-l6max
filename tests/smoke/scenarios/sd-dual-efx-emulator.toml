version = 1
name = "sd-dual-efx-emulator"
models = ["l6max"]
backends = ["headless"]
state = "dual-efx-room"
card = "empty"
sd_patches = ["dual-efx"]
gdb = true

[[audio_input]]
channel = 1
loop-tone = { hz = 440.0, seconds = 1.0, amplitude = 0.1 }

[[step]]
action = "audio-input-transport"
command = "play"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "expect-heap"
minimum_free = 131072

[[step]]
action = "delay"
guest_ms = 5000
guest_timeout_ms = 10000
wall_timeout_s = 60

[[step]]
action = "dual-efx-parameter-edit"
encoder = 1
steps = 1

[[step]]
action = "press"
control = "efx-select"

[[step]]
action = "delay"
guest_ms = 3000
guest_timeout_ms = 10000
wall_timeout_s = 60

[[step]]
action = "expect-sd-patch"
loaded = true
callbacks_active = true
