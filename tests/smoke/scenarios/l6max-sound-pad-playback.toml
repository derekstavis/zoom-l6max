version = 1
name = "l6max-sound-pad-playback"
models = ["l6max"]
state = "setup-complete"
card = "assigned-pads"
backends = ["headless"]

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 120000
wall_timeout_s = 600

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 30000
wall_timeout_s = 180

# Exercise every mapped physical pad. Each action takes a fresh audio-trace
# baseline, so playback from the preceding pad cannot satisfy the next check.
[[step]]
action = "sound-pad-playback"
assignment = "saved-state"
pad = 0
target = 49
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-playback"
assignment = "saved-state"
pad = 1
target = 50
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-playback"
assignment = "saved-state"
pad = 2
target = 51
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-playback"
assignment = "saved-state"
pad = 3
target = 52
guest_timeout_ms = 15000
wall_timeout_s = 300
