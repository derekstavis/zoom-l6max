version = 1
name = "l6max-direct-midi-sync"
models = ["l6max"]
backends = ["headless"]
state = "setup-complete"
patches = ["midi-sync"]
main_sha256 = "a224a9e1da62f2dac3b931aab17f0c9a6e76b2c3caeb1ab1b81ec90d44a308c5"
main_sha256_any = ["379804b806079242bc27b36b5b59c2fb354c1b99f0307803782cd43d1dc13d1f", "2518be3e15c31611c990a5ec6a6afde0aef158070038ed0b9d2bde34b5cef06d"]

[[step]]
action = "delay"
guest_ms = 40000
guest_timeout_ms = 45000
wall_timeout_s = 900

# Confirm the startup prompts. A state spec boots without them.
[[step]]
setup_input = true
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 1950

[[step]]
setup_input = true
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 4950

[[step]]
action = "direct-usb-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120

# Mixer Control messages use USB MIDI cable 1. Verify the neighboring cables
# and an unused cable remain isolated from the firmware's channel-1 ring.
[[step]]
action = "direct-usb-midi-round-trip"
cable = 0
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "direct-usb-midi-round-trip"
cable = 2
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "direct-usb-midi-round-trip"
cable = 5
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120
