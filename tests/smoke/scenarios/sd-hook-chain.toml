version = 1
name = "sd-hook-chain"
models = ["l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
sd_patches = ["midi-sync"]
sd_bundle_mode = "ordered-chain"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = true
chain_count = 2

[[step]]
action = "host-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120
