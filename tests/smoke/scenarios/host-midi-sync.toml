version = 1
name = "host-midi-sync"
models = ["l6max"]
backends = ["headless"]
fixture = "prepared"

[[step]]
action = "delay"
guest_ms = 40000
guest_timeout_ms = 45000
wall_timeout_s = 900

# Confirm the startup prompts. A state spec boots without them.
[[step]]
setup_input = true
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 1950

[[step]]
setup_input = true
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 4950

[[step]]
action = "host-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120
