version = 1
name = "l6-sound-pad-coreaudio"
models = ["l6"]
state = "volume-meter-ready"
timing = "split"
audio_device = "driver=coreaudio,id=l6-audio,out.frequency=48000,out.channels=2,out.format=f32,out.buffer-count=12"
card = "sound-pads"
backends = ["headless"]

[[step]]
action = "delay"
guest_ms = 16000
guest_timeout_ms = 21000
wall_timeout_s = 900

# Press Pad 1's saved one-shot assignment. The case captures the CoreAudio callback for comparison with the source WAV.
[[step]]
action = "sound-pad-playback"
pad = 0
target = 49
assignment = "saved-state"
require_pad_led_change = false
playback_window_ms = 10000
guest_timeout_ms = 30000
wall_timeout_s = 300
