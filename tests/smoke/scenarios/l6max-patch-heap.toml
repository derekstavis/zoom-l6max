version = 1
name = "l6max-patch-heap"
models = ["l6max"]
backends = ["headless"]
state = "setup-complete"
patches = ["knob-dialog", "midi-sync", "din-mixer-control"]
card = "empty"

# Every public L6max patch at once, through knob popups, a recorded take and
# its playback. The heap's lowest point must leave 128 KiB free.
[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "encoder"
channel = 1
steps = 4

[[step]]
action = "delay"
guest_ms = 1000
guest_timeout_ms = 5000
wall_timeout_s = 60

[[step]]
action = "encoder"
channel = 8
steps = -4

[[step]]
action = "delay"
guest_ms = 3000
guest_timeout_ms = 10000
wall_timeout_s = 120

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "delay"
guest_ms = 10000
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-play-stop"

[[step]]
action = "delay"
guest_ms = 3000
guest_timeout_ms = 10000
wall_timeout_s = 120

[[step]]
action = "press"
control = "rec-play-stop"

[[step]]
action = "delay"
guest_ms = 5000
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-play-stop"

[[step]]
action = "delay"
guest_ms = 2000
guest_timeout_ms = 10000
wall_timeout_s = 120

[[step]]
action = "expect-heap"
minimum_free = 131072
