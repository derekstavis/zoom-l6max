version = 1
name = "sd-midi-absent"
models = ["l6", "l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
sd_patches = ["midi-sync"]
sd_bundle_mode = "absent"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 1000

[[step]]
action = "expect-sd-patch"
loaded = false
