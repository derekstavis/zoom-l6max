version = 1
name = "sd-static-all"
models = ["l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
patches = ["din-mixer-control", "knob-dialog"]
sd_patches = []

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = false

[[step]]
action = "include"
path = "fragments/l6max-din-mixer-setup.toml"

[[step]]
action = "l6max-din-mixer-control"
expect_din_ring_change = true
guest_timeout_ms = 10000
wall_timeout_s = 120

[[step]]
action = "restart"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "knob-dialog"
guest_timeout_ms = 180000
wall_timeout_s = 600
