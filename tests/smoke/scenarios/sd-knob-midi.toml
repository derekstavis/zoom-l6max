version = 1
name = "sd-knob-midi"
models = ["l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
patches = ["knob-dialog"]
sd_patches = ["midi-sync"]

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "host-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120

[[step]]
action = "knob-dialog"
guest_timeout_ms = 180000
wall_timeout_s = 600
