version = 1
name = "l6max-audio-input"
models = ["l6max"]
state = "audio-input"
card = "empty"
backends = ["headless"]

[[audio_input]]
channel = 1
loop-tone = { hz = 300.0, seconds = 1.0, amplitude = 0.004 }

[[audio_input]]
channel = 2
loop-tone = { hz = 500.0, seconds = 1.0, amplitude = 0.05 }

[[audio_input]]
channel = 3
loop-tone = { hz = 700.0, seconds = 1.0, amplitude = 0.004 }

[[audio_input]]
channel = 4
loop-tone = { hz = 900.0, seconds = 1.0, amplitude = 0.004 }

[[audio_input]]
channel = 5
loop-tone = { hz = 1100.0, seconds = 1.0, amplitude = 0.02 }

[[audio_input]]
channel = 6
loop-tone = { hz = 1300.0, seconds = 1.0, amplitude = 0.02 }

[[audio_input]]
channel = 7
loop-tone = { hz = 1700.0, seconds = 1.0, amplitude = 0.02 }

[[audio_input]]
channel = 8
loop-tone = { hz = 1900.0, seconds = 1.0, amplitude = 0.02 }

[[step]]
action = "audio-input-transport"
command = "play"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 900

[[step]]
action = "delay"
guest_ms = 5000
guest_timeout_ms = 10000
wall_timeout_s = 300

[[step]]
action = "analog"
channel = 1
steps = 16

[[step]]
action = "analog"
channel = 2
steps = 16

[[step]]
action = "analog"
channel = 3
steps = 8

[[step]]
action = "analog"
channel = 4
steps = 16

[[step]]
action = "analog"
channel = 5
steps = 16

[[step]]
action = "delay"
guest_ms = 5000
guest_timeout_ms = 20000
wall_timeout_s = 300

# Channels 1, 3 and 4 use the high-gain word and channel 2 the low-gain word.
[[step]]
action = "expect-output-tone"
hz = 300.0
left_db = -56.3
right_db = -56.3

[[step]]
action = "expect-output-tone"
hz = 500.0
left_db = -34.2
right_db = -34.2

[[step]]
action = "expect-output-tone"
hz = 700.0
left_db = -56.3
right_db = -56.3

[[step]]
action = "expect-output-tone"
hz = 900.0
left_db = -56.2
right_db = -56.2

[[step]]
action = "expect-output-tone"
hz = 1100.0
left_db = -51.1
right_db = -51.1

[[step]]
action = "expect-output-tone"
hz = 1300.0
left_db = -51.1
right_db = -51.1

[[step]]
action = "expect-output-tone"
hz = 1700.0
left_db = -51.1
right_db = -51.1

[[step]]
action = "expect-output-tone"
hz = 1900.0
left_db = -51.1
right_db = -51.1

[[step]]
action = "press"
control = "channel.1.mute"

[[step]]
action = "delay"
guest_ms = 2000
guest_timeout_ms = 10000
wall_timeout_s = 120

[[step]]
action = "expect-output-tone"
hz = 300.0

[[step]]
action = "expect-output-tone"
hz = 500.0
left_db = -34.2
right_db = -34.2

