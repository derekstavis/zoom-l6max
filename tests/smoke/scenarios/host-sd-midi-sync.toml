version = 1
name = "host-sd-midi-sync"
# L6 is excluded: with the Patch loader installed, L6 firmware never starts its
# USB device controller in the emulator, with or without modules on the card
# (the fixture-built loader behaves the same). See l6max_host::sd_patches::known_issue.
models = ["l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
# The engine installs the Patch loader in the stock firmware and writes the
# hosted midi-sync module to the card, as `--sd-patch midi-sync` and the
# emulator's SD card choice do.
installed_sd_patches = ["midi-sync"]

# USB MIDI is usable after the same boot interval as the installed-patch cases.
[[step]]
action = "delay"
guest_ms = 40000
guest_timeout_ms = 45000
wall_timeout_s = 900

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "direct-usb-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120
