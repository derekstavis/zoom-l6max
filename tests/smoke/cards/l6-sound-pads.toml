# Sound-pad audio for the waveform and playback cases. Below full scale so firmware
# gain does not clip it.
version = 1
model = "l6"

[[file]]
path = "SOUND_PAD/PAD1/SWEEP.WAV"
sweep = { low_hz = 100.0, high_hz = 8000.0, seconds = 6.0, amplitude = 0.7 }

[[sound_pad]]
pad = 1
file = "SOUND_PAD/PAD1/SWEEP.WAV"
mode = "one-shot"
level = 49
