version = 1
model = "l6max"

[[file]]
path = "SOUND_PAD/PAD4/TONE660.WAV"
levels = { hz = 660.0, steps = [
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.1, right = 0.0 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.0, right = 0.1 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.5, right = 0.0 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.0, right = 0.5 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.1, right = 0.0 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
] }

[[sound_pad]]
pad = 4
file = "SOUND_PAD/PAD4/TONE660.WAV"
mode = "one-shot"
