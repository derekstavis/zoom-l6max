[workspace]
resolver = "3"
members = ["emulator/host", "emulator/gui", "tools/*"]
default-members = ["emulator/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
l6max-host = { path = "emulator/host" }
l6fw = { path = "tools/l6fw" }
sd-image = { path = "tools/sd-image" }
l6max-diagnostics = { path = "tools/diagnostics" }
libc = "0.2.189"
memmap2 = "0.9.10"
serde_json = "1.0"
sha2 = "0.10"
qapi = { version = "0.15.0", features = ["qmp"] }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
image = { version = "0.25.1", default-features = false, features = ["png"] }

# Optimize GPUI and its cached icon renderer while retaining application
# debug assertions and symbols.
[profile.dev.package.gpui]
opt-level = 1
[profile.dev.package.resvg]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.tiny-skia-path]
opt-level = 2
[profile.dev.package.usvg]
opt-level = 2
[profile.dev.package.simplecss]
opt-level = 2
[profile.dev.package.fontdb]
opt-level = 2
[profile.dev.package.rustybuzz]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
