[package]
name = "l6max-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
headless-screenshots = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
tracing.workspace = true
smoke-core = { path = "../../tools/smoke-core" }
l6max-host.workspace = true
l6fw.workspace = true
sha2.workspace = true
libc.workspace = true
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "17d3378bb9724867ab875dd865e7d22147d684fa" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "17d3378bb9724867ab875dd865e7d22147d684fa", features = ["font-kit"] }
smallvec = "1.15"

# GPUI selects Linux window-system backends by feature; none is on by default.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "17d3378bb9724867ab875dd865e7d22147d684fa", features = ["font-kit", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSApplication", "NSOpenPanel", "NSSavePanel"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
