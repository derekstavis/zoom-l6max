name: Restore Rust cache
description: Restore the Cargo sources and dependency builds that main saved.

inputs:
  prefix:
    description: Cache key prefix; jobs whose builds cannot share dependencies use their own.
    default: rust

outputs:
  hit:
    description: Whether a cache for exactly these dependencies exists.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Only pull requests fall back to a cache for other dependencies. On main a miss
    # means a clean build, so what it saves is one build's output and cannot grow.
    - id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ inputs.prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
        restore-keys: ${{ github.ref != 'refs/heads/main' && format('{0}-{1}-{2}-', inputs.prefix, runner.os, runner.arch) || '' }}
