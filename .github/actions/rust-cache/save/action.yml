name: Save Rust cache
description: Save dependency builds, without the workspace's own crates, which change on every commit.

runs:
  using: composite
  steps:
    - name: Remove workspace crates
      shell: bash
      run: |
        packages=()
        while read -r name; do packages+=(-p "$name"); done < <(
          cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].name'
        )
        cargo clean --locked "${packages[@]}"
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
