# Copy to config.toml at the repository root, which Git ignores. A packaged app keeps
# its own in its data directory. The GUI saves its selections here, keeping comments.
# Relative paths follow this file.
version = 1

# The model to run without --model.
model = "l6max"

# Your stock update packages. The test runner reads only these; a test for a model
# with no package is BLOCKED.
[firmware]
l6 = "/absolute/path/to/L6.BIN"
l6max = "/absolute/path/to/L6max.bin"

# Settings for each model's emulator: its SD card, the firmware patches it runs, and
# the audio its input channels play, 1-8 on L6max and 1-6 on L6, from WAV files of any
# common rate and depth. Patches are knob-dialog, midi-sync and din-mixer-control on
# L6max, and midi-sync on L6. `sd_patches` loads patches from the SD card instead:
# the firmware gets the Patch loader, and the card gets the patch files in PATCHES/.
# knob-dialog and midi-sync can load from an L6max card.
#
# [emulator.l6max]
# sd_card = "/absolute/path/to/card.img"
# patches = ["din-mixer-control"]
# sd_patches = ["knob-dialog", "midi-sync"]
#
# [emulator.l6max.input_patch]
# 1 = "/absolute/path/to/kick.wav"
# 5 = "/absolute/path/to/overheads.wav"
